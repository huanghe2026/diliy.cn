name: Deploy Go services (SSH TUI + Quiz API)

on:
  push:
    paths:
      - 'ssh/**'
      - '.github/workflows/deploy-go.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'ssh/go.mod'
          cache: false

      - name: Cross-compile geoyuan-ssh (linux/amd64)
        run: |
          cd ssh
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o geoyuan-ssh .
          file geoyuan-ssh
          ls -lh geoyuan-ssh

      - name: Cross-compile geoyuan-api (linux/amd64)
        run: |
          cd ssh/cmd/api
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o ../../geoyuan-api .
          cd ../..
          file geoyuan-api
          ls -lh geoyuan-api

      - name: SCP binaries to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          port: 2222
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "ssh/geoyuan-ssh,ssh/geoyuan-api"
          target: "/tmp"
          strip_components: 1

      - name: Install + restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          port: 2222
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Deploy geoyuan-ssh ==="
            systemctl stop geoyuan-ssh 2>/dev/null || true
            sleep 1
            install -o geoyuan -g geoyuan -m 0755 /tmp/geoyuan-ssh /opt/geoyuan-ssh/geoyuan-ssh
            systemctl start geoyuan-ssh
            sleep 2
            systemctl is-active geoyuan-ssh && echo "geoyuan-ssh OK" || echo "geoyuan-ssh FAILED"

            echo "=== Deploy geoyuan-api ==="
            systemctl stop geoyuan-api 2>/dev/null || true
            sleep 1
            install -o geoyuan -g geoyuan -m 0755 /tmp/geoyuan-api /opt/geoyuan-api/geoyuan-api
            systemctl start geoyuan-api
            sleep 2
            systemctl is-active geoyuan-api && echo "geoyuan-api OK" || echo "geoyuan-api FAILED"

            echo "=== Health ==="
            curl -s http://localhost:3002/api/health
            echo ""
            ss -tlnp | grep -E ":(22|3002)"
